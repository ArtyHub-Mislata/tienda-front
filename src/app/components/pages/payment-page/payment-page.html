@if (showMessage) {
  <div class="c-payment__toast c-payment__toast--success" [class.is-hiding]="isHiding">
    <i class="fas fa-check-circle"></i>
    <span>Adquisición confirmada correctamente.</span>
  </div>
}

@if (showErrorMessage) {
  <div class="c-payment__toast c-payment__toast--error" [class.is-hiding]="isHiding">
    <i class="fas fa-exclamation-circle"></i>
    <span>Transacción declinada. Verifique sus datos.</span>
  </div>
}

<div class="c-payment">
  <div class="c-payment__container">
    
    <div class="c-payment__card">
      
      <div class="c-payment__header">
        <h1 class="c-payment__header-title">Checkout</h1>
        <p class="c-payment__header-subtitle">Pasarela Segura de Pagos</p>
        <div class="c-payment__header-divider"></div>
      </div>

      <form (ngSubmit)="onSubmit(paymentForm)" #paymentForm="ngForm">
        
        <div class="c-payment__group">
          <label>Titular de la tarjeta</label>
          <input
            type="text"
            name="cardHolderName"
            placeholder="COMO APARECE EN LA TARJETA"
            [(ngModel)]="payment.cardDto.holderName"
            required
            uppercase
          />
        </div>

        <div class="c-payment__group">
          <label>Número de Tarjeta</label>
          <input
            type="text"
            name="cardNumber"
            placeholder="0000 0000 0000 0000"
            [(ngModel)]="payment.cardDto.nTarget"
            required
            minlength="16"
            maxlength="19"
          />
        </div>

        <div class="c-payment__row">
          <div class="c-payment__group">
            <label>Expiración (MM/YY)</label>
            <input
              type="text"
              name="expirationDate"
              placeholder="MM/YY"
              [(ngModel)]="payment.cardDto.dateExpiration"
              required
              maxlength="5"
            />
          </div>

          <div class="c-payment__group">
            <label>CVC / CVV</label>
            <input
              type="password"
              name="cvv"
              placeholder="123"
              [(ngModel)]="payment.cardDto.cvv"
              required
              maxlength="4"
            />
          </div>
        </div>

        <div class="c-payment__total">
          <span>Importe Total</span>
          <strong>{{ payment.amount | currency: 'EUR' : 'symbol' : '1.2-2' }}</strong>
        </div>

        <button
          class="c-payment__btn"
          type="submit"
          [disabled]="paymentForm.invalid || loading">
          @if(loading) {
            Procesando...
          } @else {
            Confirmar Pago
          }
        </button>

        <div style="text-align: center; margin-top: 1.5rem;">
            <a routerLink="/" style="color: #666; font-size: 0.75rem; text-decoration: none; letter-spacing: 2px;">CANCELAR OPERACIÓN</a>
        </div>

      </form>
    </div>
  </div>
</div>
