<div class="auth-gallery-wrapper">
    <div class="auth-container">
        
        <div class="auth-card">
            <div class="auth-header">
                <h1 class="auth-header__title">ArtyHub</h1>
                <div class="auth-header__divider"></div>
            </div>

            <form (ngSubmit)="onLogin(loginForm)" #loginForm="ngForm">
                
                <div class="gallery-input-group">
                    <label>Identificación (Email)</label>
                    <input 
                        type="email" 
                        placeholder="coleccionista@artyhub.com"
                        [(ngModel)]="credential.email" 
                        name="email" 
                        required 
                        email 
                        #emailCtrl="ngModel">
                    
                    @if (emailCtrl.invalid && emailCtrl.touched) {
                        <div class="gallery-alert">
                            Formato de email inválido
                        </div>
                    }
                </div>

                <div class="gallery-input-group">
                    <label>Clave de Acceso</label>
                    <input 
                        type="password" 
                        placeholder="••••••••"
                        [(ngModel)]="credential.password" 
                        name="password" 
                        required 
                        #passwordCtrl="ngModel">

                    @if (passwordCtrl.invalid && passwordCtrl.touched) {
                        <div class="gallery-alert">
                            La contraseña es requerida
                        </div>
                    }
                </div>

                @if (generalError) {
                    <div class="gallery-alert" style="margin-bottom: 1.5rem;">
                        {{ generalError }}
                    </div>
                }

                <button 
                    class="btn-gallery-auth"
                    [disabled]="loginForm.invalid || loading">
                    @if(loading) {
                        Accediendo...
                    } @else {
                        Ingresar
                    }
                </button>

                <div style="margin-top: 2rem; border-top: 1px solid rgba(255,255,255,0.1); padding-top: 1rem;">
                    <button routerLink="/register" class="btn-gallery-auth--secondary">
                        REGISTRARSE
                    </button>
                </div>

            </form>
        </div>

    </div>
</div>
