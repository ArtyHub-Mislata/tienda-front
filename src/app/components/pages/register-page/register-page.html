<div class="register-gallery-wrapper">
    <div class="register-container">
        
        <div class="register-card">
            <div class="register-header">
                <h1 class="register-header__title">Registro</h1>
                <div class="register-header__divider"></div>
            </div>

            <form (ngSubmit)="onRegister(registerForm)" #registerForm="ngForm">
                
                <div class="register-input-group">
                    <label>Email *</label>
                    <input 
                        type="email" 
                        name="email" 
                        placeholder="contacto@artista.com" 
                        [(ngModel)]="user.email" 
                        required 
                        email
                        #emailCtrl="ngModel">
                    @if (emailCtrl.invalid && emailCtrl.touched) {
                        <div class="register-alert">Email inválido</div>
                    }
                </div>

                <div class="register-input-group">
                    <label>Contraseña *</label>
                    <input 
                        type="password" 
                        name="password" 
                        placeholder="••••••••••" 
                        [(ngModel)]="user.password" 
                        required
                        minlength="6"
                        #passCtrl="ngModel">
                    @if (passCtrl.invalid && passCtrl.touched) {
                        <div class="register-alert">Mínimo 6 caracteres</div>
                    }
                </div>

                <div class="register-input-group">
                    <label>Nombre *</label>
                    <input 
                        type="text" 
                        name="name" 
                        placeholder="Tu nombre completo" 
                        [(ngModel)]="user.name" 
                        required>
                </div>

                <div class="register-input-group">
                    <label>Dirección *</label>
                    <input 
                        type="text" 
                        name="address" 
                        placeholder="Ciudad, País" 
                        [(ngModel)]="user.address" 
                        required>
                </div>

                <div class="register-input-group">
                    <label>Foto de perfil *</label>
                    <input 
                        type="text" 
                        name="imageProfileUrl" 
                        placeholder="https://..." 
                        [(ngModel)]="user.imageProfileUrl" 
                        required>
                </div>

                <div class="register-input-group">
                    <label>Descripción</label>
                    <textarea 
                        name="description" 
                        placeholder="Describe brevemente tu perfil o enfoque artístico..." 
                        [(ngModel)]="user.description">
                    </textarea>
                </div>

                <button 
                    class="btn-register-auth" 
                    type="submit"
                    [disabled]="registerForm.invalid || loading">
                    @if(loading) {
                        Procesando...
                    } @else {
                        Crear cuenta
                    }
                </button>
            </form>
        </div>
    </div>
</div>
