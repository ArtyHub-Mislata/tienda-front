@if (showToast) {
  <div class="c-toast" 
       [class.c-toast--success]="!isError" 
       [class.c-toast--error]="isError" 
       [class.is-hiding]="isHiding">
    <i class="fas" [class.fa-check-circle]="!isError" [class.fa-exclamation-circle]="isError"></i>
    <span>{{ toastMessage }}</span>
  </div>
}

@if (artwork) {
  <div class="artwork-detail-wrapper">
    
    <div class="artwork-detail-container">
        
        <div class="artwork-detail__image-section">
            <div class="artwork-detail__image-container">
                <img [src]="artwork.image" [alt]="artwork.name" class="artwork-detail__img" />
            </div>
        </div>

        <div class="artwork-detail__info-section">
            
            <div class="artwork-detail__header">
                <h1 class="artwork-detail__title g--font-montserrat-arabic">{{ artwork.name }}</h1>
                <a routerLink="/users/{{ artwork.userDto.id }}" class="artwork-detail__artist">
                    por {{ artwork.userDto.name }}
                </a>
            </div>

            <div class="artwork-detail__meta">
                <span class="artwork-detail__category">{{ artwork.categoryDto.name }}</span>
                @if(artwork.stock > 0) {
                    <span class="artwork-detail__stock in-stock">Disponible ({{ artwork.stock }})</span>
                } @else {
                    <span class="artwork-detail__stock out-stock">Agotado</span>
                }
            </div>

            <div class="artwork-detail__description">
                <p>{{ artwork.description }}</p>
            </div>

            <div class="artwork-detail__actions">
                <div class="artwork-detail__price-tag">
                    <span class="currency">€</span>
                    <span class="amount g--font-questrial">{{ artwork.price }}</span>
                </div>

                <div class="artwork-detail__buttons">
                    <button c-button funcion="normal" importancia="primaria" tamano="grande" (click)="addToCart()" [disabled]="artwork.stock <= 0" class="btn-add-cart">
                        {{ artwork.stock > 0 ? 'AÑADIR AL CARRITO' : 'NO DISPONIBLE' }}
                    </button>
                </div>
            </div>

        </div>

    </div>

  </div>
}

<c-chatbot></c-chatbot>
